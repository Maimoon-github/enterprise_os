services:
  postgres:
    image: postgres:16-alpine
    container_name: marketing-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketing_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketing_os_secret}
      POSTGRES_DB: ${POSTGRES_DB:-marketing_os_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketing_os} -d ${POSTGRES_DB:-marketing_os_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketing-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: marketing-os-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: marketing-os-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_admin_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  langfuse:
    image: ghcr.io/langfuse/langfuse:2
    container_name: marketing-os-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketing_os}:${POSTGRES_PASSWORD:-marketing_os_secret}@postgres:5432/${POSTGRES_DB:-marketing_os_db}
      NEXTAUTH_SECRET: ${SECRET_KEY:-change_this_to_a_secure_random_64_char_hex_string}
      SALT: ${SECRET_KEY:-change_this_to_a_secure_random_64_char_hex_string}
      NEXTAUTH_URL: http://localhost:3001
      TELEMETRY_ENABLED: "false"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: marketing-os-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
