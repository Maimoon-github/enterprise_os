## Tinyproxy Hardened Egress Allowlist Configuration
## Enforces DENY_ALL default with strict domain allowlisting and SSRF protection

User nobody
Group nogroup
Port 8118
Listen 0.0.0.0
Timeout 30
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogLevel Info
MaxClients 100
MinSpareServers 2
MaxSpareServers 10
StartServers 5

# Allow incoming connections from internal sandbox subnet
Allow 172.16.0.0/12
Allow 10.0.0.0/8
Allow 192.168.0.0/16
Allow 127.0.0.1

# Enable Domain Filtering (DENY_ALL by default)
Filter "/etc/tinyproxy/allowed-domains.txt"
FilterURLs Yes
FilterExtended On
FilterCaseSensitive No
FilterDefaultDeny Yes

# Restrict allowed CONNECT ports to standard web ports (80, 443)
ConnectPort 443
ConnectPort 80

# Disable via header to prevent information leakage
DisableViaHeader Yes
