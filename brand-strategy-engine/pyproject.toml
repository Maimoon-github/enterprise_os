[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brand-strategy-engine"
version = "2.4.0"
description = "Universal AI Brand Strategy Engine powered by Google Antigravity SDK and local Ollama inference"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Principal AI Systems Architect", email = "architect@enterprise-os.internal" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "beautifulsoup4>=4.12.3",
    "pypdf>=4.2.0",
    "python-docx>=1.1.2",
    "pandas>=2.2.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "internal_sandbox*"]

[tool.pyright]
venvPath = "/home/maimoon-amin/miniconda3/envs"
venv = "strategy_engine"
include = ["src", "internal_sandbox", "tests"]
extraPaths = [
    ".",
    "src",
    "internal_sandbox",
    "/home/maimoon-amin/miniconda3/envs/strategy_engine/lib/python3.11/site-packages",
]

[tool.ruff]
line-length = 100
target-version = "py311"
