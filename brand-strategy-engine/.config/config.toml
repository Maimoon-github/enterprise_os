[engine]
version = "2.4.0"
environment = "production-local"
default_mode = "Mode_A_Personal"
max_validator_revision_cycles = 3
zero_hallucination_enforcement = true
evidence_storage_path = "/app/evidence_blobs"

[runtime.ollama]
base_url = "http://ollama-node:11434/v1"
request_timeout_seconds = 180.0
embedding_model = "nomic-embed-text:latest"

[models.orchestrator]
name = "qwen2.5:14b-instruct-q4_K_M"
temperature = 0.1
context_window = 32768

[models.analyst]
name = "llama3.2-vision:11b-instruct-q4_K_M"
temperature = 0.0
context_window = 16384

[models.specialist]
name = "qwen2.5:14b-instruct-q4_K_M"
temperature = 0.2
context_window = 16384

[models.growth]
name = "qwen2.5:14b-instruct-q4_K_M"
temperature = 0.2
context_window = 32768

[models.validator]
name = "deepseek-r1:32b-qwen-distill-q4_K_M"
temperature = 0.0
context_window = 32768

[sandbox.vnc]
host = "vnc-browser-sandbox"
port = 5901
display = ":1"
viewport_width = 1920
viewport_height = 1080
color_depth = 24
headless = true
screenshot_timeout_ms = 5000

[storage.postgres]
host = "postgres-pgvector"
port = 5432
database = "brand_strategy_db"
user = "engine_user"
password = ""
pool_size = 10
vector_dimensions = 768
