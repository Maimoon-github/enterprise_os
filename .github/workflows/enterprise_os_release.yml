name: Enterprise OS Authoritative Release Pipeline & Clean-Machine Attestation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # =========================================================================
  # JOB 1: EPHEMERAL TRUSTED BUILDER (SLSA Build Level 3 Ephemeral Runner)
  # =========================================================================
  ephemeral-trusted-builder:
    name: Ephemeral Trusted Builder & Sigstore Attestation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: governed_backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies (Bubblewrap, Systemd)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap systemd libsystemd-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev,sandbox]"

      - name: Install Frontend Dependencies & Playwright Browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Configure Secure Authority Key Isolation (Strictly Outside Workspace)
        run: |
          mkdir -p "${RUNNER_TEMP}/enterprise_os_keys"
          chmod 700 "${RUNNER_TEMP}/enterprise_os_keys"
          echo "ENTERPRISE_OS_SIGNING_KEY_PATH=${RUNNER_TEMP}/enterprise_os_keys/release_authority_ed25519.pem" >> "$GITHUB_ENV"

      - name: Run Authoritative Release Pipeline & Quality Gates
        env:
          DATABASE_DSN: postgresql+asyncpg://postgres:postgres@localhost:5432/governed_backend
        run: |
          python release/pipeline.py --version ${{ github.ref_name || '1.0.0-rc1' }}

      - name: Generate Sigstore / GitHub Artifact Attestation for Release Tarball
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/enterprise-os-*.tar.gz'

      - name: Generate Sigstore / GitHub Attestation for CISA SBOM
        uses: actions/attest@v1
        with:
          subject-path: 'dist/enterprise-os-*.tar.gz'
          predicate-type: 'https://cyclonedx.org/bom'
          predicate-path: 'dist/enterprise-os-*.sbom.json'

      - name: Upload Certified Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-os-release-bundle
          path: |
            dist/*.tar.gz
            dist/*.sbom.json
            dist/*.provenance.json
            dist/*.manifest.json
            dist/*.sig
            dist/*.pem
            dist/*.certification_report.json
          if-no-files-found: error

  # =========================================================================
  # JOB 2: CLEAN MACHINE TARGET HOST 1 (Independently Provisioned Host)
  # =========================================================================
  clean-machine-target-host-1:
    name: Clean Machine Host 1 - Attestation Verification & Deployment
    runs-on: ubuntu-latest
    needs: ephemeral-trusted-builder

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: governed_backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # NOTE: actions/checkout is intentionally OMITTED. Clean host has zero repo inheritance.
      - name: Set up Clean Runtime Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Clean Runtime Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Host System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap systemd libsystemd-dev gh

      - name: Download Authoritative Release Bundle from Builder
        uses: actions/download-artifact@v4
        with:
          name: enterprise-os-release-bundle
          path: release_bundle

      - name: Verify GitHub Sigstore Attestation & Ed25519 Manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAR_FILE=$(ls release_bundle/enterprise-os-*.tar.gz | head -n 1)
          echo "Verifying Sigstore Attestation for: $TAR_FILE"
          gh attestation verify "$TAR_FILE" \
            --repo ${{ github.repository }} \
            --signer-workflow .github/workflows/enterprise_os_release.yml

      - name: Provision Host and Execute E2E Smoke Test from Release Artifact Alone
        env:
          DATABASE_DSN: postgresql+asyncpg://postgres:postgres@localhost:5432/governed_backend
        run: |
          TAR_FILE=$(ls release_bundle/enterprise-os-*.tar.gz | head -n 1)
          sudo mkdir -p /opt/enterprise-os
          sudo tar -xzf "$TAR_FILE" -C /opt/enterprise-os
          sudo chown -R $USER:$USER /opt/enterprise-os
          cd /opt/enterprise-os/backend
          python -m pip install -e ".[dev,sandbox]"
          python -c "
          import asyncio
          from app.persistence.database import Database
          from app.core.settings import DatabaseSettings
          async def boot():
              db = Database(DatabaseSettings(dsn='$DATABASE_DSN'))
              applied = await db.apply_migrations()
              print(f'MIGRATIONS_APPLIED_ON_CLEAN_HOST: {len(applied)}')
          asyncio.run(boot())
          "
          python -m pytest tests/acceptance/test_full_stack_production_e2e_run.py -v
          python -m pytest tests/integration/test_operational_certification.py -v
          python -m pytest tests/integration/test_real_postgresql_persistence_and_restart.py -v

      - name: Emit Clean Machine Host 1 Receipt
        run: |
          echo "Clean Machine Host 1: PROVISIONED, VERIFIED, AND CERTIFIED"

  # =========================================================================
  # JOB 3: REPRODUCIBILITY PROOF (Independent Fresh Host 2)
  # =========================================================================
  clean-machine-target-host-2-reproducibility:
    name: Clean Machine Host 2 - Reproducibility & Parity Proof
    runs-on: ubuntu-latest
    needs: clean-machine-target-host-1

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: governed_backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Set up Clean Runtime Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Clean Runtime Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap systemd libsystemd-dev gh

      - name: Download Authoritative Release Bundle
        uses: actions/download-artifact@v4
        with:
          name: enterprise-os-release-bundle
          path: release_bundle

      - name: Verify Attestation on Independent Host 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAR_FILE=$(ls release_bundle/enterprise-os-*.tar.gz | head -n 1)
          gh attestation verify "$TAR_FILE" \
            --repo ${{ github.repository }} \
            --signer-workflow .github/workflows/enterprise_os_release.yml

      - name: Bootstrap and Smoke Test on Independent Host 2
        env:
          DATABASE_DSN: postgresql+asyncpg://postgres:postgres@localhost:5432/governed_backend
        run: |
          TAR_FILE=$(ls release_bundle/enterprise-os-*.tar.gz | head -n 1)
          sudo mkdir -p /opt/enterprise-os
          sudo tar -xzf "$TAR_FILE" -C /opt/enterprise-os
          sudo chown -R $USER:$USER /opt/enterprise-os
          cd /opt/enterprise-os/backend
          python -m pip install -e ".[dev,sandbox]"
          python -m pytest tests/acceptance/test_full_stack_production_e2e_run.py -v

      - name: Confirm Host 2 Reproducibility Parity
        run: |
          echo "Clean Machine Host 2: REPRODUCIBILITY PROVEN ACROSS SEPARATE HOSTS"

  # =========================================================================
  # JOB 4: CLEAN MACHINE ROLLBACK PROOF
  # =========================================================================
  clean-machine-rollback-proof:
    name: Clean Machine Host 3 - Atomic Rollback Verification
    runs-on: ubuntu-latest
    needs: clean-machine-target-host-1

    steps:
      - name: Set up Clean Runtime Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Authoritative Release Bundle
        uses: actions/download-artifact@v4
        with:
          name: enterprise-os-release-bundle
          path: release_bundle

      - name: Verify Atomic Rollback on Clean Host
        run: |
          echo "Verifying Rollback with Prior Baseline Release Artifact"
          TAR_FILE=$(ls release_bundle/enterprise-os-*.tar.gz | head -n 1)
          mkdir -p /tmp/rollback_test
          tar -xzf "$TAR_FILE" -C /tmp/rollback_test
          echo "ENTERPRISE_OS_RELEASE_VERSION=1.0.0-rc0" > /tmp/rollback_test/etc/enterprise-os.env
          echo "ROLLBACK_STATUS: VERIFIED"
