name: CI & Regression Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SKILL.md progressive-disclosure packages
        run: |
          python backend/scripts/validate_skills.py

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and sync workspace
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --frozen --all-packages
      - name: Run Ruff Lint Checks
        run: |
          uv run ruff check backend
      - name: Run Mypy Type Checks
        run: |
          uv run mypy backend
      - name: Validate Compose Config
        run: |
          docker compose config
          docker compose -f docker-compose.yml -f infra/compose/docker-compose.dev.yml config
          docker compose -f docker-compose.yml -f infra/compose/docker-compose.prod.yml config

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and Build Contracts
        run: |
          cd packages/contracts && npm install && npm run generate
      - name: Typecheck and Build Frontend
        run: |
          cd frontend && npm install --legacy-peer-deps && npm run typecheck && npm run build
