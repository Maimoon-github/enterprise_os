[project]
name = "agentic-brand-marketing-os"
version = "0.1.0"
description = "Self-Hosted Production-Grade Agentic Brand Marketing Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "backend",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
