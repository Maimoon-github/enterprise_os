[project]
name = "agentic-brand-marketing-os"
version = "0.1.0"
description = "Self-Hosted Production-Grade Agentic Brand Marketing Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "backend",
]

[dependency-groups]
dev = [
    "ruff>=0.7.2",
    "mypy>=1.13.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "B904", "UP042", "UP046"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "backend"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
